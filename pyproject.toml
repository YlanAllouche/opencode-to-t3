[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opencode-to-t3"
version = "0.1.0"
description = "Copy-only OpenCode v1/v2 conversation archives for T3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["t3-archive-core==0.1.0"]

[project.scripts]
opencode-t3 = "opencode_t3.cli:main"

[tool.setuptools.packages.find]
include = ["opencode_t3*"]
